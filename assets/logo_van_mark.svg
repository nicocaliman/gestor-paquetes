<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Sello/badge — doble anillo en vez del círculo genérico con reflejos de app de delivery -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="#8B7FA0" stroke-width="1.5" opacity="0.45"/>
  <circle cx="100" cy="100" r="86" fill="#1B2A4A" stroke="#8B7FA0" stroke-width="3"/>

  <!-- Furgoneta — icono de trazo plano, mismo lenguaje que el resto de iconos Lucide de la app -->
  <path d="M 40,112 L 40,90 Q 40,84 46,84 L 100,84 L 118,98 L 128,98 L 128,112 Z"
        fill="none" stroke="#F7F4EC" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Parabrisas — único acento de color de marca, sin gradiente ni brillo -->
  <path d="M 102,87.5 L 114,87.5 L 117.5,96 L 104,96 Z" fill="#8B7FA0"/>

  <!-- Ruedas -->
  <circle cx="58" cy="112" r="9" fill="#1B2A4A" stroke="#F7F4EC" stroke-width="3"/>
  <circle cx="112" cy="112" r="9" fill="#1B2A4A" stroke="#F7F4EC" stroke-width="3"/>

  <!-- Rastro de ruta — puntos, no líneas de velocidad genéricas -->
  <circle cx="29" cy="108" r="3.4" fill="#8B7FA0" opacity="0.6"/>
  <circle cx="20" cy="108" r="2.4" fill="#8B7FA0" opacity="0.4"/>
  <circle cx="13" cy="108" r="1.5" fill="#8B7FA0" opacity="0.25"/>
</svg>
